services:
  postgres:
    image: postgres:17-alpine
    container_name: institute9-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: institute9
    ports:
      - "5432:5432"
    volumes:
      - institute9_pgdata:/var/lib/postgresql/data

volumes:
  institute9_pgdata:
